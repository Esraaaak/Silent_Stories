<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Artwork</title>
    <link rel="stylesheet" href="style.css">

    <style>
    /* --- Submit Artwork Page Specific Styles --- */
    main {
        padding-top: 120px; /* space for fixed header */
        text-align: center;
    }

    #artworkForm {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        background-color: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        max-width: 500px;
        margin: 0 auto 30px auto;
    }

    #artworkForm label {
        font-weight: 500;
        align-self: flex-start;
    }

    #artworkForm input[type="text"],
    #artworkForm input[type="email"],
    #artworkForm textarea,
    #artworkForm input[type="file"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 1rem;
    }

    #artworkForm textarea {
        resize: vertical;
    }

    #artworkForm button {
        padding: 10px 25px;
        font-size: 1rem;
        background-color: var(--accent);
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    #artworkForm button:hover {
        background-color: #a06645;
    }

    #preview {
        display: block;
        max-width: 300px;
        height: auto;
        margin: 20px auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .back-home {
        display: inline-block;
        margin-bottom: 50px;
        text-decoration: none;
        color: var(--accent);
        font-weight: 500;
    }

    .back-home:hover {
        color: #a06645;
    }
    </style>
</head>
<body>
<header>
        <div class="logo">Silent Stories</div>
        <nav class="nav-links">
            <a href="Silent storiest home.html" style="color:var(--accent);">Home</a>
            <a href="ArtExhibitions.html">Exhibitions</a>
            <a href="classicPage.html">Classic</a>
            <a href="modernPage.html">Modern</a>
            <a href="ArtistsPage.html">Artists</a>
            <a href="SubmitArtworkPage.html">Submit</a>
             <a href="aboutPage.html">About</a>
            <a href="Contact.html">Contact</a>
            
            
            <span class="auth-links">
                <a href="login.html">Login</a>
                <a href="signup.html">Sign Up</a>
            </span>
        </nav>
    </header>
    <main>
        <h1>Submit Your Artwork</h1>

        <form id="artworkForm">
            <label for="artistName">Artist Name:</label>
            <input type="text" id="artistName" name="artistName" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="artworkTitle">Artwork Title:</label>
            <input type="text" id="artworkTitle" name="artworkTitle" required>

            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="4" required></textarea>

            <label for="artworkFile">Upload Artwork:</label>
            <input type="file" id="artworkFile" name="artworkFile" accept="image/*" required>

            <button type="submit">Submit</button>
        </form>

        <img id="preview" src="" alt="Artwork Preview">

        <a href="Silent storiest home.html" class="back-home">Back to Home</a>
    </main>

    <footer>
        <p>© 2025 Silent Stories. All rights reserved.</p>
        <p>
            <a href="aboutPage.html">About</a> | 
            <a href="ArtistsPage.html">Artists</a> | 
            <a href="Contact.html">Contact us</a>
        </p>
    </footer>

    <script>
        document.getElementById('artworkFile').onchange = function() {
            const file = this.files[0];
            if (file) {
                document.getElementById('preview').src = URL.createObjectURL(file);
            } else {
                document.getElementById('preview').src = '';
            }
        };

        document.getElementById('artworkForm').onsubmit = function(e) {
            e.preventDefault();
            alert('Form submitted');
        };
    </script>

</body>
</html>
