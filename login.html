<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patron Access | Silent Stories</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
      /* --- GLOBAL STYLES (Logo/Base/Header) --- */
      .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: bold;
        }

      /* --- LOGIN SPECIFIC STYLES --- */

      /* 2. HERO SECTION */
      .hero {
            min-height: 90vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* FIX: Increased padding-top to ensure content is below fixed header */
            padding: 15rem 1rem 4rem 1rem; 
            position: relative;
            overflow: hidden;
        }
        
     .hero::before {
            content: '';
            position: fixed; /* FIX: Changed from fixed to absolute for better flow */
            top: 0;             /* FIX: Corrected position */
            left: 0;            /* FIX: Corrected position */
            width: 100%;
            height: 100%;
            /* Subtle background effect */
            background-image: url('https://images.unsplash.com/photo-1577720580479-7d839d829c73?q=80&w=2000&auto=format&fit=crop');
            background-size: cover; /* Adjusted to cover for better fit */
            background-position: center;
            opacity: 0.08; 
            z-index: -1;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        .hero h1 {
            font-size: clamp(3.5rem, 8vw, 7rem);
            line-height: 0.9;
            margin-bottom: 2rem;
            letter-spacing: -2px;
        }

        .hero h1 span {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 0.15em;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .hero h1 span::before, .hero h1 span::after {
            content: '';
            display: block;
            width: 30px;
            height: 1px;
            background-color: var(--accent);
        }

        .hero p {
            max-width: 550px;
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

      /* 3. LOGIN CONTAINER (Narrower than Contact) */
      .login-container {
          max-width: 500px; /* Narrow width for focus */
          margin: 0 auto 80px auto;
          padding: 0 20px;
      }

      .login-box {
          background-color: #fff;
          padding: 50px 40px;
          border: 1px solid #e0e0e0;
          box-shadow: 0 5px 20px rgba(0,0,0,0.03);
          text-align: center;
      }

      .form-group {
          margin-bottom: 25px;
          text-align: left;
      }

      /* Labels styled as Era Tags */
      label {
          display: block;
          font-family: 'Montserrat', sans-serif;
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 2px;
          color: var(--accent);
          font-weight: bold;
          margin-bottom: 8px;
      }

      /* Elegant Inputs */
      input[type="email"],
      input[type="password"] {
          width: 100%;
          padding: 15px;
          border: 1px solid #ccc;
          background-color: #fafafa;
          font-family: 'Cormorant Garamond', serif;
          font-size: 1.2rem;
          color: var(--text-primary);
          transition: border-color 0.3s, background-color 0.3s;
      }

      input:focus {
          outline: none;
          border-color: var(--accent);
          background-color: #fff;
      }

      /* 4. BUTTONS & LINKS */
      .btn-outline {
          width: 100%;
          padding: 1.2rem;
          border: 1px solid var(--text-primary);
          background: transparent;
          font-family: 'Montserrat', sans-serif;
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 3px;
          cursor: pointer;
          transition: all 0.3s;
          font-weight: 600;
          color: var(--text-primary);
          margin-top: 10px;
      }

      .btn-outline:hover {
          background-color: var(--text-primary);
          color: #fff;
      }


      .auth-links a {
          text-decoration: none;
          border-bottom: 1px solid transparent;
          transition: border-color 0.3s, color 0.3s;
      }

      .auth-links a:hover {
          color: var(--accent);
          border-bottom-color: var(--accent);
      }

      .back-home {
          margin-top: 40px;
          display: inline-block;
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 2px;
      }
  </style>
</head>
<body>

 <header>
        <div class="logo">Silent Stories</div>
        <nav class="nav-links">
            <a href="Silent storiest home.html" style="color:var(--accent);">Home</a>
            <a href="ArtExhibitions.html">Exhibitions</a>
            <a href="classicPage.html">Classic</a>
            <a href="modernPage.html">Modern</a>
            <a href="ArtistsPage.html">Artists</a>
            <a href="SubmitArtworkPage.html">Submit</a>
             <a href="aboutPage.html">About</a>
            <a href="Contact.html">Contact</a>
            
            
            <span class="auth-links">
                <a href="login.html">Login</a>
                <a href="signup.html">Sign Up</a>
            </span>
        </nav>
    </header>

<section id="login-page">
  
  <div class="hero">
      <h1>
          <span>Member Access</span>
          Log in
      </h1>
  </div>


  <main class="login-container">
    <div class="login-box">
        
      <form id="loginForm" action="login.php" method="POST">
        
        <div class="form-group">
          <label for="loginEmail">Registered Email</label>
          <input type="email" id="loginEmail" name="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="loginPassword">Passkey</label>
          <input type="password" id="loginPassword" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-outline">Enter Gallery</button>

        <div class="auth-links">
            <span>New to the collection? <a href="signup.html">Request Membership</a></span>
            <a href="Silent storiest home.html" class="back-home">Return to Home</a>
        </div>
      </form>
    </div>
  </main>
</section>

<footer>
        <p>© 2025 Silent Stories. All rights reserved.</p>
        <p class="in1">
            <a href="aboutPage.html">About</a> |
            <a href="Contact.html">Contact</a> |
            <a href="ArtistsPage.html">Artists</a>
        </p>
    </footer>

<script src="JS.js"></script>
</body>
</html>
