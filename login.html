<body>

<!-- ================= HEADER ================= -->
<!-- Site logo + main navigation -->

  <div class="logo">Silent Stories</div>

  <nav class="nav-links">

    </span>
  </nav>

<!-- ================= HERO ================= -->
<!-- Page title / intro section -->
<div class="hero-content">
  <h1>
    <span>Member Access</span>
    Log in
  </h1>
</div>

<!-- ================= LOGIN PAGE ================= -->
<!-- Wrapper for login page content -->
<section id="login-page">

  <!-- ================= MAIN ================= -->
  <!-- Centers the login form on the page -->
  <main class="login-container">

    <!-- Login form box -->
    <div class="login-box">

      <!-- ================= FORM ================= -->
      <!-- User login form -->
      <form id="loginForm" action="loginPHP.php" method="POST">

        <!-- Email input -->
        <div class="form-group">
          <label>Registered Email</label>
          <input id="loginEmail"
                 name="email"
                 type="email"
                 placeholder="name@example.com"
                 required>
        </div>

        <!-- Password input -->
        <div class="form-group">
          <label>Passkey</label>
          <input id="loginPassword"
                 name="password"
                 type="password"
                 placeholder="••••••••"
                 required>
        </div>

        <!-- Submit button -->
        <button class="btn-outline">Enter Gallery</button>

        <!-- Extra links -->
        <div class="form-links">
          <span>New to the collection? <a href="signup.html">Request Membership</a></span>
          <a href="Silent storiest home.html" class="back-home">Return to Home</a>
        </div>

        <!-- Login status message -->
        <p id="Message"></p>

      </form>
      <!-- ================= END FORM ================= -->

    </div>
  </main>
</section>
