<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Silent Storiest</title>
    <link rel="stylesheet" href="lscss.css">
</head>
<body>

<header>
    <h1>Login Silent Storiest</h1>
</header>

<div class="form-container">
    <form id="loginForm" action="login.php" method="POST">  
        <fieldset>
            <legend><h2>Login to Your Account</h2></legend>

            <label for="loginEmail">Email:</label>
            <input type="email" id="loginEmail" name="email" required>

            <label for="loginPassword">Password:</label>
            <input type="password" id="loginPassword" name="password" required>

            <button type="submit" class="btn">Login</button>

            <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
            <a href="Silent storiest home.html" class="back-home">Back to Home</a>
        </fieldset>
    </form>
</div>

<footer>
    <p>© 2025 Silent Storiest. All rights reserved.</p>
    <p class="in1">
        <a href="aboutPage.html">About</a> | 
        <a href="Contact.html">Contact us</a> | 
        <a href="ArtistsPage.html">Artists Page</a>|
    </p>
</footer>

<script>
    // دالة حفظ الإيميل المسجل (مماثلة في signup.html)
    function saveEmailOnLogin(email) {
        let registeredEmails = new Set();
        const storedEmails = localStorage.getItem('registeredEmails');
        if (storedEmails) {
            registeredEmails = new Set(JSON.parse(storedEmails));
        }
        if (!registeredEmails.has(email)) {
             registeredEmails.add(email);
             localStorage.setItem('registeredEmails', JSON.stringify(Array.from(registeredEmails)));
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); 
        
        // *** محاكاة نجاح تسجيل الدخول ***
        const email = document.getElementById('loginEmail').value;
        
        saveEmailOnLogin(email); // نضمن حفظ الإيميل كمسجل

        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userName', 'LoggedIn User'); 
        localStorage.setItem('userEmail', email); 

        // 🎯 التوجيه المشروط (تم تصحيح أسماء الملفات بناءً على توضيحك)
        const pendingEvent = localStorage.getItem('pendingRegistrationEvent');
        let redirectURL;
        
        if (pendingEvent) {
            // إذا كان هناك طلب معلق، عد إلى صفحة المعارض (ArtExhibitions.html)
            redirectURL = 'ArtExhibitions.html'; 
        } else {
            // إذا لم يكن هناك طلب معلق، عد إلى الصفحة الرئيسية (Silent storiest home.html)
            redirectURL = 'Silent storiest home.html';
        }

        window.location.href = redirectURL;
    });
</script>

</body>
</html>
