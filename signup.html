<!-- ================= SIGNUP PAGE ================= -->
<!-- Wrapper for signup page content -->
<section id="singup-page">

  <!-- ================= MAIN ================= -->
  <!-- Centers the signup form -->
  <main class="signup-container">

    <!-- Signup form box -->
    <div class="signup-box">

      <!-- ================= FORM ================= -->
      <!-- User registration form -->
      <form id="signupForm" action="signupPHP.php" method="POST">

        <!-- Full name -->
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" name="name" placeholder="e.g.name" required>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" name="email"
                 placeholder="e.g. name@gmail.com" required>
        </div>

        <!-- Saudi mobile number -->
        <div class="form-group">
          <label for="signupPhone">Mobile Number (SA)</label>
          <input type="tel" id="signupPhone" name="phone"
                 placeholder="05XXXXXXXX"
                 pattern="^05\d{8}$"
                 title="Must start with 05 and contain exactly 10 digits"
                 required>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="signupPassword">Create Password</label>
          <input type="password" id="signupPassword" name="password"
                 placeholder="Min 8 chars, 1 Uppercase, 1 Symbol (?/*-?!@#)"
                 pattern="^[A-Z][a-zA-Z\d/*\-?!@#\.]{7,}$"
                 title="Minimum of 8 characters. Begins with an uppercase letter. Includes lowercase letters. Contains at least one symbol from ?/*-?!@#."
                 required>

          <p id="Message"></p>
        </div>

        <!-- Submit button -->
        <button class="btn-outline">Register Membership</button>

        <!-- Extra links -->
        <div class="form-links">
          <span>Already a patron? <a href="login.html">Access Account</a></span>
          <a href="Silent storiest home.html" class="back-home">Return to Home</a>
        </div>

      </form>
      <!-- ================= END FORM ================= -->

    </div>
  </main>
</section>
