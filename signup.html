<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Application | Silent Stories</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <style>
      /* --- CLASSIC SIGNUP SPECIFIC STYLES --- */
      /* 2. HERO SECTION */
      .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: bold;
        }

        /* --- 3. HERO SECTION (Banner) --- */
        .hero {
            min-height: 90vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Added padding-top to ensure content is below fixed header */
            padding: 10rem 1rem 4rem 1rem; 
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: fixed;
            top: 100;
            left: 100;
            width: 100%;
            height: 100%;
            /* Subtle background effect */
            background-image: url('https://images.unsplash.com/photo-1577720580479-7d839d829c73?q=80&w=2000&auto=format&fit=crop');
            background-size:auto;
            background-position: center;
            opacity: 0.08; 
            z-index: -1;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        .hero h1 {
            font-size: clamp(3.5rem, 8vw, 7rem);
            line-height: 0.9;
            margin-bottom: 2rem;
            letter-spacing: -2px;
        }

        .hero h1 span {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 0.15em;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .hero h1 span::before, .hero h1 span::after {
            content: '';
            display: block;
            width: 30px;
            height: 1px;
            background-color: var(--accent);
        }

        .hero p {
            max-width: 550px;
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }


      /* 3. SIGNUP CONTAINER */
      .signup-container {
          max-width: 550px; /* Slightly wider than login to accommodate details */
          margin: 0 auto 80px auto;
          padding: 0 20px;
      }

      .signup-box {
          background-color: #fff;
          padding: 50px 40px;
          border: 1px solid #e0e0e0;
          box-shadow: 0 5px 20px rgba(0,0,0,0.03);
          text-align: center;
      }

      .form-group {
          margin-bottom: 25px;
          text-align: left;
      }

      /* Labels styled as Era Tags */
      label {
          display: block;
          font-family: 'Montserrat', sans-serif;
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 2px;
          color: var(--accent);
          font-weight: bold;
          margin-bottom: 8px;
      }

      /* Elegant Inputs */
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="tel"] {
          width: 100%;
          padding: 15px;
          border: 1px solid #ccc;
          background-color: #fafafa;
          font-family: 'Cormorant Garamond', serif;
          font-size: 1.2rem;
          color: var(--text-primary);
          transition: border-color 0.3s, background-color 0.3s;
      }

      input:focus {
          outline: none;
          border-color: var(--accent);
          background-color: #fff;
      }

      /* Helper text for validation rules */
      .input-helper {
          font-size: 0.75rem;
          color: #888;
          margin-top: 5px;
          font-style: italic;
      }

      /* 4. BUTTONS & LINKS */
      .btn-outline {
          width: 100%;
          padding: 1.2rem;
          border: 1px solid var(--text-primary);
          background: transparent;
          font-family: 'Montserrat', sans-serif;
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 3px;
          cursor: pointer;
          transition: all 0.3s;
          font-weight: 600;
          color: var(--text-primary);
          margin-top: 10px;
      }

      .btn-outline:hover {
          background-color: var(--text-primary);
          color: #fff;
      }

      .auth-links {
          margin-top: 30px;
          font-size: 0.9rem;
          color: var(--text-secondary);
          display: flex;
          flex-direction: column;
          gap: 15px;
          font-family: 'Montserrat', sans-serif;
      }

      .auth-links a {
          text-decoration: none;
          border-bottom: 1px solid transparent;
          transition: border-color 0.3s, color 0.3s;
      }

      .auth-links a:hover {
          color: var(--accent);
          border-bottom-color: var(--accent);
      }
  </style>
</head>
<body>

<header>
        <div class="logo">Silent Stories</div>
        <nav class="nav-links">
            <a href="Silent storiest home.html" style="color:var(--accent);">Home</a>
            <a href="ArtExhibitions.html">Exhibitions</a>
            <a href="classicPage.html">Classic</a>
            <a href="modernPage.html">Modern</a>
            <a href="ArtistsPage.html">Artists</a>
            <a href="Contact.html">Contact</a>
            
            <span class="auth-links">
                <a href="login.html">Login</a>
                <a href="signup.html">Sign Up</a>
            </span>
        </nav>
    </header>

<section id="signup-page">
  
  <div class="hero">
      <h1>
          <span>Become a Patron</span>
          Create Account
      </h1>
  </div>

  <main class="signup-container">
    <div class="signup-box">
        
      <form id="signupForm" action="singup.php" method="POST">
        
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" name="name" required placeholder="e.g.name">
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" name="email" required placeholder="e.g. name@gmail.art">
        </div>

        <div class="form-group">
          <label for="signupPhone">Mobile Number (SA)</label>
          <input type="tel" id="signupPhone" name="phone" placeholder="05XXXXXXXX" 
                 pattern="^05\d{8}$" 
                 title="Must start with 05 and contain exactly 10 digits" required>
          <div class="input-helper">Format: 05XXXXXXXX</div>
        </div>

        <div class="form-group">
          <label for="signupPassword">Create Password</label>
          <input type="password" id="signupPassword" name="password" placeholder="••••••••"
                 pattern="^[A-Z][a-zA-Z\d/*\-?!@#\.]{7,}$"
                 title="Minimum of 8 characters. Begins with an uppercase letter. Includes lowercase letters. Contains at least one symbol from ?/*-?!@#."
                 required>
          <div class="input-helper">Min 8 chars, 1 Uppercase, 1 Symbol (?/*-?!@#)</div>
        </div>

        <button type="submit" class="btn-outline">Register Membership</button>

        <div class="auth-links">
            <span>Already a patron? <a href="login.html">Access Account</a></span>
            <a href="Silent storiest home.html">Return to Home</a>
        </div>
      </form>
    </div>
  </main>
</section>

<footer>
        <p>© 2025 Silent Stories. All rights reserved.</p>
        <p class="in1">
            <a href="aboutPage.html">About</a> |
            <a href="Contact.html">Contact</a> |
            <a href="ArtistsPage.html">Artists</a>
        </p>
    </footer>

<script src="JS.js"></script>
</body>
</html>
