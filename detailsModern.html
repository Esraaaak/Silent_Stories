    <script>

        description: `
        <h4>Overview</h4>
        <p>
        This contemporary work reflects the emotional tension and uncertainty of modern life.
        The composition suggests an inner transformation, balancing vulnerability with hope.
        Rather than depicting a literal scene, the painting focuses on psychological experience.
        </p>
        <h4>Style and Expression</h4>
        <p>
        Bold colors and expressive forms dominate the surface, creating visual intensity.
        Loose brushwork enhances emotional immediacy rather than realism.
        The contrast between light and dark areas reinforces feelings of conflict and renewal.
        </p>
        <h4>Artistic Significance</h4>
        <p>
        The artwork represents a modern continuation of expressionist traditions.
        It emphasizes personal emotion as a central subject.
        The painting invites viewers to reflect on change, resilience, and self-discovery.
        </p>
        `

    art2: {

        description: `
        <h4>Overview</h4>
        <p>
        Light at the North Sea captures a contemplative moment between sea and sky.
        The painting emphasizes atmosphere over detail, focusing on mood and light.
        It evokes calmness and quiet reflection.
        </p>
        <h4>Style and Technique</h4>
        <p>
        Soft color transitions and subtle textures define the composition.
        The artist uses light as the main visual element rather than form.
        The horizon creates balance and spatial depth.
        </p>
        <h4>Artistic Significance</h4>
        <p>
        This work reflects contemporary landscape painting’s shift toward emotion and perception.
        Nature becomes a space for meditation rather than documentation.
        The painting highlights the expressive power of light.
        </p>
        `
    },
    art3: {
        title: "GOOD BY",
        artist: "Monika Luniak",

        <h4>Overview</h4>
        <p>

        The painting avoids literal imagery, relying instead on movement and rhythm.
        It suggests emotional release and transformation.
        </p>
        <h4>Style and Movement</h4>
        <p>
        Dynamic brushstrokes and layered textures create a sense of motion.
        Colors interact freely, emphasizing spontaneity.
        The absence of fixed forms allows open interpretation.
        </p>
        <h4>Artistic Significance</h4>

        if (art) {
            document.getElementById("details-container").innerHTML = `
                <h1>${art.title}</h1>
                <h3>${art.artist} (${art.year})</h3>
                <img src="${art.image}" alt="${art.title}">
                <p>${art.description}</p>
            `;
        } else {
            document.getElementById("details-container").innerHTML = `<p>Artwork not found.</p>`;
        }
